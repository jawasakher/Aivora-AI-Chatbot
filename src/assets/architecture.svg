<svg width="1200" height="500" viewBox="0 0 1200 500"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E293B"/>
    <stop offset="100%" stop-color="#312E81"/>
  </linearGradient>

  <marker id="arrow"
          markerWidth="10"
          markerHeight="10"
          refX="8"
          refY="3"
          orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#60A5FA"/>
  </marker>
</defs>

<rect width="1200" height="500" rx="24" fill="#0F172A"/>

<text x="600" y="55"
      text-anchor="middle"
      font-family="Arial"
      font-size="30"
      font-weight="700"
      fill="#F8FAFC">
  Gemini AI Chatbot Architecture
</text>

<g font-family="Arial" text-anchor="middle">

  <rect x="70" y="190" width="190" height="100"
        rx="18" fill="url(#card)" stroke="#60A5FA"/>

  <text x="165" y="232" font-size="23" fill="#F8FAFC">
    User
  </text>

  <text x="165" y="260" font-size="15" fill="#CBD5E1">
    Interaction
  </text>

  <rect x="350" y="190" width="210" height="100"
        rx="18" fill="url(#card)" stroke="#818CF8"/>

  <text x="455" y="232" font-size="23" fill="#F8FAFC">
    React UI
  </text>

  <text x="455" y="260" font-size="15" fill="#CBD5E1">
    Components
  </text>

  <rect x="650" y="190" width="210" height="100"
        rx="18" fill="url(#card)" stroke="#A78BFA"/>

  <text x="755" y="232" font-size="23" fill="#F8FAFC">
    Application
  </text>

  <text x="755" y="260" font-size="15" fill="#CBD5E1">
    State & API Logic
  </text>

  <rect x="950" y="190" width="180" height="100"
        rx="18" fill="url(#card)" stroke="#38BDF8"/>

  <text x="1040" y="232" font-size="23" fill="#F8FAFC">
    Gemini
  </text>

  <text x="1040" y="260" font-size="15" fill="#CBD5E1">
    AI API
  </text>

</g>

<path d="M260 240 H340"
      stroke="#60A5FA"
      stroke-width="4"
      marker-end="url(#arrow)"/>

<path d="M560 240 H640"
      stroke="#818CF8"
      stroke-width="4"
      marker-end="url(#arrow)"/>

<path d="M860 240 H940"
      stroke="#A78BFA"
      stroke-width="4"
      marker-end="url(#arrow)"/>

<path d="M1040 300 C1040 390 760 390 760 300"
      fill="none"
      stroke="#38BDF8"
      stroke-width="3"
      stroke-dasharray="8 8"
      marker-end="url(#arrow)"/>

<text x="900" y="385"
      font-family="Arial"
      font-size="18"
      fill="#94A3B8">
  AI Response
</text>

</svg>