<svg width="1400" height="360" viewBox="0 0 1400 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>

  <circle cx="1150" cy="80" r="120" fill="#6366F1" opacity=".12"/>
  <circle cx="1250" cy="270" r="180" fill="#38BDF8" opacity=".08"/>
  <circle cx="160" cy="320" r="140" fill="#8B5CF6" opacity=".08"/>

  <g transform="translate(100 95)">
    <rect x="0" y="0" width="170" height="140" rx="32"
          fill="#111827" stroke="#60A5FA" stroke-width="3"/>

    <circle cx="52" cy="62" r="13" fill="#60A5FA"/>
    <circle cx="118" cy="62" r="13" fill="#A78BFA"/>

    <path d="M45 96 Q85 125 125 96"
          fill="none"
          stroke="#E0E7FF"
          stroke-width="7"
          stroke-linecap="round"/>
  </g>

  <text x="330" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="700"
        fill="url(#text)">
    Gemini AI Chatbot
  </text>

  <text x="335" y="205"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        fill="#CBD5E1">
    Modern AI conversational interface
  </text>

  <text x="335" y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#94A3B8">
    React • Vite • JavaScript • Google Gemini API
  </text>

  <path d="M335 285 H850"
        stroke="#60A5FA"
        stroke-width="3"
        opacity=".6"/>

  <circle cx="880" cy="284" r="6" fill="#A78BFA" filter="url(#glow)"/>
</svg>